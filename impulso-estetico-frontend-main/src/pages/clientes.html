<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes — Impulso Estético</title>
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--branco); border-radius: 12px; padding: 32px; width: 100%; max-width: 460px; }
    .modal h2 { font-size: 1.1rem; margin-bottom: 20px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: .85rem; color: var(--cinza); margin-bottom: 4px; }
    .field input, .field textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--borda); border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: .9rem; background: var(--bg); }
    .field input:focus, .field textarea:focus { outline: 2px solid var(--rosa); border-color: transparent; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="sidebar"></div>

  <main class="main">
    <div class="top-bar">
      <div>
        <h1 class="page-title">Clientes</h1>
        <p class="page-sub">Cadastro e histórico</p>
      </div>
      <button class="btn btn-primary" onclick="abrirModal()">+ Novo cliente</button>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Telefone</th>
            <th>E-mail</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="tabela-clientes">
          <tr><td colspan="4">Carregando...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Modal novo cliente -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2>Novo cliente</h2>
      <div class="field"><label>Nome *</label><input type="text" id="f-nome" placeholder="Nome completo"></div>
      <div class="field"><label>Telefone</label><input type="tel" id="f-telefone" placeholder="(51) 99999-0000"></div>
      <div class="field"><label>E-mail</label><input type="email" id="f-email" placeholder="email@exemplo.com"></div>
      <div class="field"><label>Data de nascimento</label><input type="date" id="f-nasc"></div>
      <div class="field"><label>Observações</label><textarea id="f-obs" rows="3" placeholder="Pele sensível, alergias..."></textarea></div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="fecharModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="salvarCliente()">Salvar cliente</button>
      </div>
    </div>
  </div>

  <script src="../components/sidebar.js"></script>
  <script>
    const API = 'http://localhost:3000/api';
    Sidebar.render('clientes');

    async function carregarClientes() {
      try {
        const res = await fetch(`${API}/clientes`);
        const clientes = await res.json();
        document.getElementById('tabela-clientes').innerHTML = clientes.length
          ? clientes.map(c => `
              <tr>
                <td><strong>${c.nome}</strong></td>
                <td>${c.telefone || '—'}</td>
                <td>${c.email || '—'}</td>
                <td><span class="badge ${c.ativo ? 'badge-confirmado' : 'badge-cancelado'}">${c.ativo ? 'Ativa' : 'Inativa'}</span></td>
              </tr>`).join('')
          : '<tr><td colspan="4">Nenhum cliente cadastrado.</td></tr>';
      } catch {
        document.getElementById('tabela-clientes').innerHTML = '<tr><td colspan="4">Erro ao carregar clientes.</td></tr>';
      }
    }

    function abrirModal() { document.getElementById('modal').classList.add('open'); }
    function fecharModal() { document.getElementById('modal').classList.remove('open'); }

    async function salvarCliente() {
      const nome = document.getElementById('f-nome').value.trim();
      if (!nome) { alert('Nome é obrigatório.'); return; }

      await fetch(`${API}/clientes`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nome,
          telefone: document.getElementById('f-telefone').value,
          email:    document.getElementById('f-email').value,
          data_nasc:document.getElementById('f-nasc').value,
          observacoes: document.getElementById('f-obs').value,
        })
      });

      fecharModal();
      carregarClientes();
    }

    carregarClientes();
  </script>
</body>
</html>
